<!doctype html><html lang="es" class="auth-pending"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eliminar calicatas · Agrícola Yoye</title><meta name="theme-color" content="#234b36"><link rel="stylesheet" href="../../assets/private-app.css?v=20260904-aforoform"><link rel="stylesheet" href="../../assets/calicatas.css?v=20260904-aforoform"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.min.js"></script><script defer src="../../assets/shared-auth.js?v=20260904-aforoform"></script></head><body><main class="cal-shell"><header class="cal-top"><a href="./" class="back">← Calicatas</a><img src="../../assets/yoye-logo.png" class="cal-logo" alt="Agrícola Yoye"><span id="state" class="status">Conectando…</span></header><section class="cal-hero"><div class="eyebrow">Gestión segura</div><h1>Eliminar calicatas</h1><p>Los registros se ocultan del historial y gráficos, pero quedan recuperables en Supabase.</p></section><section class="panel"><label class="field wide"><span>Cuartel</span><select id="quarter"><option value="">Selecciona un cuartel…</option></select></label><div id="list" class="history-list"><p class="empty-note">Selecciona un cuartel para ver sus registros.</p></div></section></main><script>(()=>{'use strict';let db,session,profile;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function ready(e){db=e.detail.client;session=e.detail.session;if(!session)return;const {data:p,error}=await db.from('perfiles').select('organizacion_id,nombre_completo').eq('id',session.user.id).maybeSingle();if(error||!p){$('#state').textContent='Sin perfil';return}profile=p;const {data:q}=await db.from('cuarteles').select('id,codigo,cuartel,cultivo').eq('organizacion_id',p.organizacion_id).eq('activo',true).order('codigo');$('#quarter').innerHTML='<option value="">Selecciona un cuartel…</option>'+(q||[]).map(x=>`<option value="${x.id}">${esc(x.codigo||x.cuartel)} · ${esc(x.cultivo||'')}</option>`).join('');$('#state').textContent='Conectado'}async function load(){const id=$('#quarter').value;if(!id){$('#list').innerHTML='<p class="empty-note">Selecciona un cuartel para ver sus registros.</p>';return}$('#list').innerHTML='<p class="empty-note">Cargando…</p>';const {data,error}=await db.from('calicatas').select('id,fecha,hora,ubicacion,responsable,creado_en').eq('organizacion_id',profile.organizacion_id).eq('cuartel_id',id).eq('activo',true).order('fecha',{ascending:false}).order('creado_en',{ascending:false});if(error){$('#list').innerHTML=`<p class="message error">${esc(error.message)}</p>`;return}if(!data?.length){$('#list').innerHTML='<p class="empty-note">No hay registros activos.</p>';return}$('#list').innerHTML=data.map(r=>`<article class="history-item" style="padding:16px;margin-bottom:10px"><div style="display:flex;align-items:center;gap:12px;justify-content:space-between"><div><b>${esc(r.fecha)}</b><div class="history-meta">${esc(r.ubicacion||'Sin ubicación')} · ${esc(r.responsable||'Sin responsable')}</div></div><button type="button" data-id="${r.id}" data-date="${esc(r.fecha)}" class="del" style="border:1px solid #a94840;background:#fff;color:#8f352f;border-radius:12px;padding:11px 14px;font-weight:800">Eliminar</button></div></article>`).join('');document.querySelectorAll('.del').forEach(b=>b.onclick=()=>remove(b))}async function remove(b){if(!confirm(`¿Eliminar la calicata del ${b.dataset.date}?\n\nSe ocultará del historial y gráficos. Podrá recuperarse desde Supabase.`))return;b.disabled=true;b.textContent='Eliminando…';const {error}=await db.from('calicatas').update({activo:false,actualizado_por:session.user.id}).eq('id',b.dataset.id).eq('organizacion_id',profile.organizacion_id);if(error){alert('No fue posible eliminar: '+error.message);b.disabled=false;b.textContent='Eliminar';return}await load()}$('#quarter').addEventListener('change',load);addEventListener('yoye-auth-ready',ready);addEventListener('DOMContentLoaded',()=>setTimeout(async()=>{try{const c=window.yoyeSupabase;if(!c)return;const {data}=await c.auth.getSession();if(data?.session)dispatchEvent(new CustomEvent('yoye-auth-ready',{detail:{client:c,session:data.session}}))}catch(e){console.error(e)}},800));})();</script></body></html>
